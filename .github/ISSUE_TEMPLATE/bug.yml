name: 缺陷报告
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、稳定的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 软件版本、操作系统、硬件和相关配置。
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: RAW 数据信息
      description: 尺寸、位深、排列、打包方式和最小样本。上传前确认数据已脱敏且允许共享。
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图与其他证据
      description: 请先移除令牌、用户路径和敏感数据。
