name: 功能需求
description: 提议一项可验证的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与用户价值
      description: 谁在什么场景遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 需要做什么，明确不做什么？
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 输入与输出数据
      description: 包括 RAW 尺寸、位深、排列、打包方式、样本授权和期望输出。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可测量的 Given / When / Then 条件。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险与补充信息
      description: 性能、兼容性、隐私或依赖风险。
